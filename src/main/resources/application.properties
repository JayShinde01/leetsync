spring.application.name=leetsync

server.port=${PORT:8080}

# ====================================================================
# DATABASE
# ====================================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ====================================================================
# GITHUB OAUTH
# ====================================================================

github.client-id=${GITHUB_CLIENT_ID}
github.client-secret=${GITHUB_CLIENT_SECRET}
github.oauth-redirect-uri=${GITHUB_OAUTH_REDIRECT_URI}

github.connect-timeout=5000
github.read-timeout=30000

# ====================================================================
# JWT
# ====================================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ====================================================================
# TOKEN ENCRYPTION
# ====================================================================

encryption.key=${LEETSYNC_ENCRYPTION_KEY}

# ====================================================================
# LOGGING
# ====================================================================

logging.level.com.leetsync=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=INFO

leetsync.extension-success-url=${LEETSYNC_EXTENSION_SUCCESS_URL}