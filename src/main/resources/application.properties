spring.application.name=leetsync
server.port=${PORT:8080}

# ====================================================================
# DATABASE CONFIGURATION (V3 Multi-User)
# ====================================================================

# MySQL Connection (Local Development)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/leetsync?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ====================================================================
# GITHUB OAUTH CONFIGURATION (V3 Multi-User)
# ====================================================================

# GitHub OAuth Credentials
# Set these environment variables:
#   GITHUB_CLIENT_ID - From GitHub OAuth App settings
#   GITHUB_CLIENT_SECRET - From GitHub OAuth App settings
#   GITHUB_OAUTH_REDIRECT_URI - Callback URL

github.client-id=${GITHUB_CLIENT_ID:Ov23liL6I5FBbWMTuywQ}
github.client-secret=${GITHUB_CLIENT_SECRET:b479597e4f76fed228c2a4e31419d7d4850eb64d}
github.oauth-redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}

# ====================================================================
# JWT AUTHENTICATION CONFIGURATION (V3)
# ====================================================================

# JWT Secret Key (minimum 32 characters recommended)
# Set environment variable: JWT_SECRET
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-minimum-32-chars}

# JWT Expiration Time (in milliseconds)
# Default: 24 hours (86400000 ms)
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ====================================================================
# TOKEN ENCRYPTION CONFIGURATION (V3)
# ====================================================================

# Encryption key for GitHub OAuth tokens stored in database
# Set environment variable: LEETSYNC_ENCRYPTION_KEY
# Must be at least 16 characters
encryption.key=${LEETSYNC_ENCRYPTION_KEY:change-this-encryption-key}

# ====================================================================
# GITHUB REST API CONFIGURATION (V2 Preserved)
# ====================================================================

# HTTP Client Timeouts (milliseconds)
github.connect-timeout=5000
github.read-timeout=30000

# ====================================================================
# LOGGING CONFIGURATION
# ====================================================================

logging.level.com.leetsync=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.boot.web.servlet.context.AnnotationConfigServletWebServerApplicationContext=WARN
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ====================================================================
# SECURITY & CORS CONFIGURATION
# ====================================================================

# CORS is configured in CorsConfig.java
# Allowed origins: chrome-extension://, localhost

# ====================================================================
# LEGACY V1/V2 GITHUB TOKEN (Deprecated in V3)
# ====================================================================

# These are no longer used in V3 for multi-user auth
# Kept for backward compatibility reference only
# In production, remove or comment out these lines

github.token=${GITHUB_TOKEN:}
github.username=${GITHUB_USERNAME:}
github.repository=${GITHUB_REPOSITORY:leetcode}
